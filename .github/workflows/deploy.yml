name: CI/CD to EKS

on:
  push:
    branches:
      - TS-3  # <-- The branch that triggers this workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AWS EKS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build Docker Image
        run: |
          docker build -t task-api .

      - name: Tag Docker Image
        run: |
          docker tag task-api:latest ${{ secrets.ECR_REGISTRY }}:latest

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}:latest

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Verify cluster access
        run: |
          aws sts get-caller-identity
          aws eks describe-cluster --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy updated image to EKS
        run: |
          kubectl set image deployment/task-api task-api=${{ secrets.ECR_REGISTRY }}:latest --record
