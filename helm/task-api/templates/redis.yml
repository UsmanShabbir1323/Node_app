# redis.yml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.env }}-redis"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Values.env }}-redis"
  template:
    metadata:
      labels:
        app: "{{ .Values.env }}-redis"
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image }}"
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.env }}-redis"
spec:
  selector:
    app: "{{ .Values.env }}-redis"
  ports:
  - port: 6379
    targetPort: 6379
