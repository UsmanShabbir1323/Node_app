apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-api-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: task.local
    http:
      paths:
      - path: /tasks
        pathType: Prefix
        backend:
          service:
            name: task-api
            port:
              number: 80
